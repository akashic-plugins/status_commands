name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: akashic-plugins/plugin-contracts
          ref: 4dd69dd621e029e51e99aa428443fa3a4ec1f6cf
          path: .plugin-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Plugin API v3
        env:
          PYTHONPATH: .plugin-contracts
        run: python -m akashic_plugin_contracts check plugin.py

  composition-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: cb2011b441cbf74142c72de63bb6c006e111d404
          path: .akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .akashic-core/requirements.txt
      - name: Install exact Core runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r .akashic-core/requirements.txt pytest pytest-asyncio
      - name: Verify Status Commands v3 composition
        env:
          AKASHIC_AGENT_ROOT: .akashic-core
          PYTHONPATH: .akashic-core
        run: .venv/bin/python -m pytest -q tests/
      - name: Verify Mobile panel behavior
        run: node --test tests/test_mobile_panel.mjs
      - name: Check v3 source types
        env:
          PYTHONPATH: .akashic-core
        run: .venv/bin/pyright --level error plugin.py
      - name: Compile Python sources
        run: python -m compileall -q plugin.py tests
      - name: Check diff formatting
        run: git diff --check
