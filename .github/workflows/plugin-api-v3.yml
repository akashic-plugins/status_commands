name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kachofugetsu09/akashic-agent
          ref: 79b80a475936bb86895a1893aaebe321918f8d74
          path: .akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .akashic-core/requirements.txt
      - name: Install exact Core runtime
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            -r .akashic-core/requirements.txt \
            -r .akashic-core/requirements-dev.txt \
            pytest pytest-asyncio
      - name: Verify Status Commands v3 composition
        env:
          AKASHIC_AGENT_ROOT: .akashic-core
          PYTHONPATH: .akashic-core
        run: .venv/bin/python -m pytest -q tests/
      - name: Verify plugin UI behavior
        run: node --test tests/test_plugin_ui.mjs
      - name: Check v3 source types
        env:
          PYTHONPATH: .akashic-core
        run: .venv/bin/pyright --pythonpath .venv/bin/python --level error plugin.py
      - name: Compile Python sources
        run: python -m compileall -q plugin.py tests
      - name: Check diff formatting
        run: git diff --check
